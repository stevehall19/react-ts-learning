apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
    {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "keycloak.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/realm: {{ .Files.Get "realms/counters-realm.json" | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            - "start-dev"
            - "--import-realm"
          env:
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ required "auth.admin.username must be set (values.local.yaml)" .Values.auth.admin.username | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.fullname" . }}
                  key: adminPassword
            - name: KC_HEALTH_ENABLED
              value: {{ .Values.keycloak.health.enabled | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 30
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "250m"
              memory: 512Mi
          volumeMounts:
            - name: keycloak-import-volume
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: keycloak-import-volume
          configMap:
            name: {{ include "keycloak.fullname" . }}-config
