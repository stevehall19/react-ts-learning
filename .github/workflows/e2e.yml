name: End to End Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  create-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: counters
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/counters-api/pom.xml

      - run: ./mvnw -B compile jib:dockerBuild
        working-directory: backend/counters-api

      - run: kind load docker-image counters-api:0.0.1-SNAPSHOT --name counters

      - run: |
          helm install counters-db backend/helm/mariadb \
            --set auth.password=e2e-password --set auth.rootPassword=e2e-root
          kubectl rollout status statefulset/counters-db-mariadb --timeout=180s

      - run: |
          helm install counters-api backend/helm/counters-api
          kubectl rollout status deployment/counters-api --timeout=180s

      - run: |
          kubectl port-forward svc/counters-api 8080:8080 > port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf localhost:8080/actuator/health/readiness && break
            sleep 1
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
      - if: failure()
        run: |
          kubectl get pods
          kubectl logs deployment/counters-api --tail=100

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
