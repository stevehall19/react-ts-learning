name: End to End Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  create-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.12.0

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
